[package]
name = "lambek"
version = "0.9.0"
description = "Deterministic intent compiler"
authors = ["Amin Gharbaoui"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "lambek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Small, fast release binary
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
