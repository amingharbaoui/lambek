name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install modules
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Force

      - name: Analyze and test
        run: ./build.ps1

      - name: Fingerprint the answers
        run: ./build.ps1 -Task Fingerprint -OutFile fingerprint.txt

      - name: Keep the fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-${{ matrix.os }}
          path: fingerprint.txt

  same:
    name: Same answers on every system
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get the fingerprints
        uses: actions/download-artifact@v4

      - name: Compare Windows and Ubuntu
        run: |
          sha256sum fingerprint-windows-latest/fingerprint.txt fingerprint-ubuntu-latest/fingerprint.txt
          diff fingerprint-windows-latest/fingerprint.txt fingerprint-ubuntu-latest/fingerprint.txt
