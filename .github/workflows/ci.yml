name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # PSResourceGet, which comes with PowerShell 7.4 and later; newer runner images no longer register PSGallery
      # for the older PowerShellGet
      - name: Install modules
        run: |
          if (-not (Get-PSResourceRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSResourceRepository -PSGallery -Trusted }
          Install-PSResource -Name Pester -Version '[5.5.0,)' -Repository PSGallery -TrustRepository -Scope CurrentUser -Quiet
          Install-PSResource -Name PSScriptAnalyzer -Repository PSGallery -TrustRepository -Scope CurrentUser -Quiet

      - name: Analyze and test
        run: ./build.ps1

      - name: Fingerprint the answers
        run: ./build.ps1 -Task Fingerprint -OutFile fingerprint.txt

      - name: Keep the fingerprint
        uses: actions/upload-artifact@v7
        with:
          name: fingerprint-${{ matrix.os }}
          path: fingerprint.txt

  proofs:
    name: Proofs judged by Lean
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Lean, a prover that shares nothing with Lambek, at a fixed version so that its verdicts do not move
      - name: Install Lean
        shell: bash
        # (GitHub may answer 503 for a moment: tried again, waiting longer each time)
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -sSfL --retry 3 --retry-all-errors -o elan-init.sh https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh &&
              sh elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
          rm -f elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Judge the proofs
        run: ./tools/Measure-LambekProof.ps1 -Show

  same:
    name: Same answers on every system
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get the fingerprints
        uses: actions/download-artifact@v7

      - name: Compare Windows and Ubuntu
        run: |
          sha256sum fingerprint-windows-latest/fingerprint.txt fingerprint-ubuntu-latest/fingerprint.txt
          diff fingerprint-windows-latest/fingerprint.txt fingerprint-ubuntu-latest/fingerprint.txt